[build-system]
requires = [
    "scikit-build-core>=0.11",
    "nanobind>=2.4",
    # Linux: the modules link the OpenMP runtime of the cpp-zarr wheel, so that a process has one
    # (cmake/Pk5dOpenMP.cmake, docs/decisions/0008-openmp-runtime.md)
    "cpp-zarr>=1.7.3,<2; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
build-backend = "scikit_build_core.build"

[project]
name = "petakit5d"
dynamic = ["version"]
description = "Petabyte-scale 5D image processing for light-sheet microscopy (Python port of PetaKit5D)"
readme = "README.md"
authors = [{ name = "Matthew Mueller" }]
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "cpp/fft/third_party/pocketfft/LICENSE.md"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "cpp-zarr>=1.7.3,<2",
    "cpp-tiff>=1.7.3,<2",
    "h5py>=3.11",
]
keywords = ["light-sheet microscopy", "deskew", "deconvolution", "stitching", "zarr", "tiff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
# [project.urls] comes with the new repository (its name and owner are the user's decision)

[project.scripts]
pk5d = "petakit5d.cli.main:main"
pk5d-master = "petakit5d.cli.master:main"

[project.optional-dependencies]
# the GPU paths (decon, its OTFs and back projectors): CuPy, CUDA 12.9's runtime and NVRTC, which
# compile for every GPU from Volta to Blackwell, and cuFFT 11.0.8, MATLAB R2024b's, with which the
# GPU FFTs give MATLAB's bits (docs/decisions/0003-gpu.md); no CUDA toolkit is needed
gpu = [
    "cupy-cuda12x>=14.2,<15",
    "nvidia-cuda-runtime-cu12>=12.9.79,<12.10",
    "nvidia-cuda-nvrtc-cu12>=12.9.86,<12.10",
    "nvidia-cufft-cu12==11.0.8.103",
    "cuda-pathfinder>=1.8.6,<2",
]
test = ["pytest>=8", "pytest-timeout>=2.3"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.8"]
# the phase-image flat field (flatfield.basic): BaSiCPy's dependencies. BaSiCPy 2.0.0 itself
# (MIT) declares scipy<1.13 (it uses only scipy.fft), which this package's scipy>=1.13 rules
# out, so it goes in after this extra: pip install --no-deps basicpy==2.0.0
basic = [
    "torch>=2.2",
    "torch-dct>=0.1.6",
    "hyperactive>=4.4,<5",
    "pooch>=1.6",
    "pydantic>=2",
    "dask>=2023.1",
    "tqdm>=4.48",
]
# the figure tools (tools.figures): MIP masks, OTF and mask outlines, tile positions
figures = ["matplotlib>=3.8"]
# N5 with blosc (MATLAB's N5 compression) and zstd before Python 3.14 (io.n5): numcodecs (MIT)
n5 = ["numcodecs>=0.13"]
# ND2 and CZI files (io.bioformats; Bio-Formats itself is not ported): nd2 (BSD-3, with dask,
# ome-types, pydantic, xsdata: BSD-3/MIT), czifile and imagecodecs (BSD-3)
formats = ["nd2>=0.12", "czifile>=2026.11.12", "imagecodecs>=2026.11.11"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
cmake.build-type = "Release"
ninja.version = ">=1.11"
wheel.packages = ["src/petakit5d"]
wheel.exclude = ["**/__pycache__/**"]
# one abi3 wheel for CPython 3.12 and newer (nanobind's stable ABI), and one for 3.11; the modules
# use no Python API outside the limited API
wheel.py-api = "cp312"
# the exact FFT add-on (FFTW, GPL) is a package of its own (cpp/fft/exact): not in this one
sdist.exclude = ["build/", "dist/", ".venv/", "**/__pycache__/**", "cpp/fft/exact/"]
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "src/petakit5d/_version.py"

# The release wheels (docs/release.md): Linux x86-64 (manylinux_2_28), macOS arm64 and Windows
# x86-64, for CPython 3.11 and 3.12 (abi3: 3.12 and newer). The exact FFT add-on (cpp/fft/exact)
# is a package and a wheel of its own, under the GPL.
[tool.cibuildwheel]
build = ["cp311-*", "cp312-*"]
skip = ["*-musllinux_*"]
test-requires = ["pytest>=8", "pytest-timeout>=2.3"]
# the installed modules load, and share one OpenMP runtime with the I/O packages (Linux)
test-command = "python -m pytest -q -p no:cacheprovider {package}/tests/test_smoke.py {package}/tests/test_openmp_runtime.py"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
# the image of the cpp-zarr and cpp-tiff wheels: its libgomp, which they bundle as
# libgomp-e985bcbb.so.1.0.0, is the one the modules link and carry (docs/decisions/0008); it
# changes together with theirs
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64:2026.06.04-1"

[tool.cibuildwheel.macos]
archs = ["arm64"]
# Apple Clang has no OpenMP runtime: Homebrew's libomp, which delocate copies into the wheel; the
# deployment target can't be older than that libomp's
before-all = "brew install libomp"
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# the build puts libomp140.x86_64.dll next to the modules; delvewheel adds the C++ runtime, and
# --no-diagnostic keeps the build machine's folders out of its record
repair-wheel-command = "delvewheel repair --ignore-existing --no-diagnostic -w {dest_dir} {wheel}"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# importlib mode: test files of different areas may share a base name
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--strict-config"]
markers = [
    "gpu: needs a usable NVIDIA GPU and CuPy (skipped otherwise)",
    "cluster: needs a real Slurm cluster (PETAKIT5D_TEST_SLURM_CONFIG; skipped otherwise)",
    "slow: takes more than about 30 s",
    "demodata: needs the demo datasets (PETAKIT5D_DEMO_DATA; skipped otherwise)",
    "oracle: compares with MATLAB references (the store, or the repo manifests)",
]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "TID", "PIE", "C4"]
ignore = ["E741"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# NumPy rounds, interpolates and orders differently from MATLAB; see docs/conventions.md
"numpy.round".msg = "use petakit5d.matlabcompat (MATLAB rounds half away from zero)"
"numpy.around".msg = "use petakit5d.matlabcompat (MATLAB rounds half away from zero)"
"numpy.rint".msg = "use petakit5d.matlabcompat (MATLAB rounds half away from zero)"
"numpy.percentile".msg = "use petakit5d.matlabcompat (MATLAB's prctile)"
"numpy.nanpercentile".msg = "use petakit5d.matlabcompat (MATLAB's prctile)"
"numpy.quantile".msg = "use petakit5d.matlabcompat (MATLAB's quantile)"
"numpy.median".msg = "use petakit5d.matlabcompat (MATLAB's median)"
"numpy.nanmedian".msg = "use petakit5d.matlabcompat (MATLAB's median)"

[tool.ruff.lint.per-file-ignores]
# the MATLAB emulations, the comparison and benchmark helpers and the tests may use them
"src/petakit5d/matlabcompat/**" = ["TID251"]
"src/petakit5d/core/**" = ["TID251"]
"src/petakit5d/testing/**" = ["TID251"]
"tests/**" = ["TID251"]
"benchmarks/**" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["petakit5d"]
