name: Python

# The Python port (python/) only; the MATLAB workflow (tests.yml) ignores python/**.
on:
  push:
    branches: [main, dev, test]
    paths: ['python/**', '.github/workflows/python.yml']
  pull_request:
    paths: ['python/**', '.github/workflows/python.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: python

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}${{ matrix.toolchain && format(' ({0})', matrix.toolchain) || '' }}
    runs-on: ${{ matrix.os }}
    # Linux and Windows are the gate (Windows since its first two fully green runs). macOS reports
    # without failing the workflow until a cpp-zarr wheel whose write_zarr doesn't crash on macOS arm64
    continue-on-error: ${{ matrix.os == 'macos-15' }}
    # macOS: the known crash restarts a worker for each of ~1,100 tests, so its suite takes from
    # 30 minutes to more than 120 (both Pythons ran out of 120 on 2026-11-18); a job out of time
    # is cancelled, and the run with it, so its test step has a limit of its own below (a step out
    # of time fails, which macOS may)
    timeout-minutes: ${{ matrix.os == 'macos-15' && 120 || 45 }}
    # the figures that tests show go through pyplot: Agg, as on Linux without a display, not
    # the runners' GUI backends (Tk on Windows, macosx)
    env:
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        # Linux, Apple silicon, Windows; the oldest tested Python with the pinned
        # environment (Linux), and the newest supported one with the newest packages
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ['3.12', '3.14']
        # Windows: the source build's own choice of toolchain (python/docs/platforms.md, "Windows:
        # the toolchain of a source build"): MinGW-w64 where MinGW-builds' GCC 12.2.0 is (mingw: in
        # tools/get_mingw.sh's folder for 3.12, first on PATH for 3.14), and else MSVC, at the
        # second attempt, after the first one left out the runners' own MinGW-w64 (GCC 15, on PATH)
        toolchain: ['']
        include:
          - {os: windows-2025, python: '3.12', toolchain: mingw}
          - {os: windows-2025, python: '3.14', toolchain: mingw}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Apple Clang has no OpenMP runtime of its own
      - if: runner.os == 'macOS'
        run: brew install libomp

      # MinGW-builds' GCC 12.2.0 (UCRT), pinned by SHA-256: for Python 3.12 in tools/get_mingw.sh's
      # own folder, off PATH, for 3.14 first on PATH; the build finds it in both
      - name: MinGW-w64's GCC (Windows, MinGW)
        if: matrix.toolchain == 'mingw'
        env:
          ON_PATH: ${{ matrix.python == '3.14' }}
        run: |
          if [ "$ON_PATH" = true ]; then
            bash tools/get_mingw.sh "$RUNNER_TEMP/mingw" | tee "$RUNNER_TEMP/mingw.txt"
            tail -n 1 "$RUNNER_TEMP/mingw.txt" >> "$GITHUB_PATH"
          else
            bash tools/get_mingw.sh
          fi

      - name: Install (pinned environment)
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: -r requirements/linux-x86_64-py312.txt
          python -m pip install -v --no-build-isolation --no-deps .

      # with the figures (matplotlib) and n5 (numcodecs) extras, so that their tests and oracle
      # cases run (both have wheels for every runner); the pinned environment stays without them
      - name: Install
        if: ${{ !(runner.os == 'Linux' && matrix.python == '3.12') }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v ".[test,figures,n5]" 2>&1 | tee "$RUNNER_TEMP/pip-install.log"

      # the toolchain the build took, and why (python/cmake/Pk5dToolchain.cmake): MinGW-builds' GCC
      # 12.2.0 where it is (where the job put it), else MSVC at the second attempt
      - name: Toolchain (Windows)
        if: runner.os == 'Windows'
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
          ON_PATH: ${{ matrix.python == '3.14' }}
        run: |
          grep -E 'petakit5d: (the Windows toolchain|no MinGW-builds)|retrying due to override' "$RUNNER_TEMP/pip-install.log" || true
          python - <<'EOF'
          import os
          from petakit5d._ext import load

          compiler = load("core").build_info()["compiler"]
          with open(os.path.join(os.environ["RUNNER_TEMP"], "pip-install.log"), encoding="utf-8", errors="replace") as f:
              log = f.read()
          took = [ln.strip() for ln in log.splitlines() if "petakit5d: the Windows toolchain:" in ln]
          print(compiler, took)
          assert len(took) == 1, took
          if os.environ["TOOLCHAIN"] == "mingw":
              where = "on PATH" if os.environ["ON_PATH"] == "true" else "in tools/get_mingw.sh's folder"
              assert compiler == "gcc 12.2.0", compiler
              assert took[0].endswith(f"the UCRT {where}: the default of source builds"), took
          else:
              assert compiler.startswith("msvc "), compiler
              assert took[0].endswith("the fallback: the attempt with MinGW-w64 failed (its log is above)"), took
              assert "gcc on PATH: " in log, "the first attempt names no gcc on PATH"
          EOF

      # W03 TRIAL ONLY: every kernel case's digest, the Anderson-Darling cases' outputs as hex
      - name: W03 trial, the kernel cases (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          python ../.github/w03_trial/dump_cases.py > "$RUNNER_TEMP/w03_cases.txt"
          grep -c DIGEST "$RUNNER_TEMP/w03_cases.txt"
          cat "$RUNNER_TEMP/w03_cases.txt"

      # W03 TRIAL ONLY
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows' && !cancelled()
        with:
          name: w03-cases-${{ matrix.toolchain || 'default' }}-${{ matrix.python }}
          path: ${{ runner.temp }}/w03_cases.txt
          if-no-files-found: warn

      # the OpenMP runtime the build put next to the modules, and the toolset's copies
      - name: OpenMP runtime (Windows)
        if: runner.os == 'Windows'
        run: |
          find "/c/Program Files/Microsoft Visual Studio"/*/*/VC -iname 'libomp140*.dll' 2>/dev/null || true
          ls "$(python -c 'import os, petakit5d; print(os.path.dirname(petakit5d.__file__))')/_ext"

      - name: Build information
        run: |
          python -m pip list
          python -c "from petakit5d._ext import load, groups; print(groups()); print(load('core').build_info())"

      # The runners' CPUs vary from run to run, and the CPU picks NumPy's SIMD loops and
      # OpenBLAS's kernels, which the last bits of some results depend on: name them in the log
      - name: CPU information
        run: |
          if [ -r /proc/cpuinfo ]; then grep -m1 -i 'model name' /proc/cpuinfo || true; fi
          if [ "$RUNNER_OS" = macOS ]; then sysctl -n machdep.cpu.brand_string; fi
          python -c "import numpy; numpy.show_runtime()"
          python - <<'EOF'
          import ctypes, glob, os, numpy
          site = os.path.dirname(os.path.dirname(numpy.__file__))
          libs = glob.glob(os.path.join(site, "numpy*", "*openblas*"))  # numpy.libs
          libs += glob.glob(os.path.join(site, "numpy", ".dylibs", "*openblas*"))  # macOS
          for f in sorted(libs):
              try:
                  get = ctypes.CDLL(f).scipy_openblas_get_corename64_
                  get.restype = ctypes.c_char_p
                  print("NumPy's OpenBLAS kernels:", get().decode(), os.path.basename(f))
              except (OSError, AttributeError) as e:
                  print("NumPy's OpenBLAS:", os.path.basename(f), e)
          EOF

      # what goes into the keys of oracle cases whose keys differed on Windows (input files
      # written there, harness files checked out there), to compare with Linux's
      - name: Oracle key probe (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: >
          python tests/platform/key_probe.py
          tests/stitch/test_imagelist.py::parse_two_cams_auto_primary
          tests/pipeline/test_filenames.py::dataset_two_channels
          tests/tools/test_mip.py::zarr.uint16.slabs
          tests/testing/test_oracle.py::identity_int8_row
          tests/io/test_convert.py::t2z.existing_kept

      - name: Tests
        if: runner.os != 'macOS'
        run: python -m pytest -v -rx --timeout=900

      # macOS: with the cpp-tiff and cpp-zarr 1.7.3 wheels, whichever is imported second crashes
      # on its first write (weak C++ symbols merged across the two modules; fixed in cpp-zarr's
      # next release). Until then the tests run in workers, so that a crash ends only its worker
      # and the rest of the suite still runs.
      - name: Tests (macOS, in workers)
        if: runner.os == 'macOS'
        timeout-minutes: 110
        run: |
          python -m pip install pytest-xdist
          python -m pytest -v --timeout=900 -n 3 --max-worker-restart=2000

  # The exact add-on's source build on Windows (cpp/fft/exact), both of its paths, as petakit5d's:
  # MSVC where only the runners' own MinGW-w64 is (left out), then MinGW-builds' GCC 12.2.0 once
  # tools/get_mingw.sh has put it in its folder; each build's two libraries load and are FFTW 3.3.8
  addon-windows:
    name: The exact add-on's source build (Python 3.12 on windows-2025)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Both toolchains' builds
        run: |
          check() {
            took=$(grep -E 'petakit5d-fftw: the Windows toolchain:' "$1" | tr -d '\r')
            echo "$took"
            if [ "$(printf '%s\n' "$took" | wc -l)" != 1 ] || [[ "$took" != *"$2" ]]; then
              echo "::error::the add-on's build took another toolchain than: $2"
              exit 1
            fi
            python -c "import ctypes, petakit5d_fftw as m; v = [(ctypes.c_char * 64).in_dll(ctypes.CDLL(p), n).value for p, n in zip(m.library_paths(), ('fftwf_version', 'fftw_version'))]; print(v); assert all(x.startswith(b'fftw-3.3.8') for x in v), v"
          }
          python -m pip install --upgrade pip
          python -m pip install -v ./cpp/fft/exact > "$RUNNER_TEMP/addon-msvc.log" 2>&1 || { tail -n 60 "$RUNNER_TEMP/addon-msvc.log"; exit 1; }
          grep -E 'petakit5d: no MinGW-builds' "$RUNNER_TEMP/addon-msvc.log" || true
          check "$RUNNER_TEMP/addon-msvc.log" "the fallback: the attempt with MinGW-w64 failed (its log is above)"
          bash tools/get_mingw.sh
          python -m pip install -v --force-reinstall --no-deps ./cpp/fft/exact > "$RUNNER_TEMP/addon-mingw.log" 2>&1 || { tail -n 60 "$RUNNER_TEMP/addon-mingw.log"; exit 1; }
          check "$RUNNER_TEMP/addon-mingw.log" "in tools/get_mingw.sh's folder: the default of source builds"

  lint:
    name: ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install "ruff==$(sed -n 's/^ruff==\([0-9.]*\).*/\1/p' requirements/linux-x86_64-py312.txt)"
      - run: ruff check .
      - run: ruff format --check .

  # The job framework in Slurm cluster mode (tests/cluster, marker cluster) on a single-node
  # Slurm set up on the runner: bash and Python tasks as real jobs, and the soak test at a size
  # for the runner's 4 CPUs. (MATLAB's workflow has the same job with bash tasks only: its jobs
  # couldn't start MATLAB there.)
  cluster:
    name: Slurm cluster mode (Python 3.12 on ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Slurm
        run: sudo bash tests/ci/setup_github_actions_slurm.sh

      - name: Install (pinned environment)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: -r requirements/linux-x86_64-py312.txt
          python -m pip install -v --no-build-isolation --no-deps .

      - name: Cluster tests
        env:
          PETAKIT5D_TEST_SLURM_CONFIG: ${{ github.workspace }}/python/tests/ci/github_actions_slurm.json
          PETAKIT5D_TEST_SLURM_SOAK: 200x20
        run: |
          # the hardening soak (test_hardening_soak.py) is sized for a real cluster and opt-in
          # (PETAKIT5D_TEST_SLURM_HARDENING), so it is left out here rather than skipped
          python -m pytest -v -rA --timeout=1800 -m cluster tests/cluster \
            --ignore=tests/cluster/test_hardening_soak.py | tee pytest-cluster.log
          # a skipped test here is a set-up problem (no Slurm, no config)
          if grep -q '^SKIPPED' pytest-cluster.log; then
            echo "::error::Cluster tests were skipped"
            exit 1
          fi

      - name: Show Slurm logs
        if: failure()
        run: |
          squeue || true
          sudo tail -n 100 /var/log/slurm/slurmctld.log /var/log/slurm/slurmd.log

  # W03 TRIAL ONLY: the runner's toolchains as the build's check sees them
  w03-probe:
    name: W03 trial, the toolchains (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The runner's gcc, MinGW-builds' 12.2.0 UCRT and msvcrt builds, the check and the choice
        run: |
          set -x
          where gcc || true
          gcc --version | head -n 1 || true
          bash tools/get_mingw.sh | tee "$RUNNER_TEMP/m.txt"
          pinned=$(tail -n 1 "$RUNNER_TEMP/m.txt")/gcc.exe
          mkdir -p "$RUNNER_TEMP/msvcrt"
          curl -sSL --fail --retry 3 -o "$RUNNER_TEMP/msvcrt/m.7z" https://github.com/niXman/mingw-builds-binaries/releases/download/12.2.0-rt_v10-rev2/x86_64-12.2.0-release-posix-seh-msvcrt-rt_v10-rev2.7z
          sha256sum "$RUNNER_TEMP/msvcrt/m.7z"
          7z x -y -o"$RUNNER_TEMP/msvcrt" "$RUNNER_TEMP/msvcrt/m.7z" > /dev/null
          msvcrt=$(cygpath -m "$RUNNER_TEMP/msvcrt/mingw64/bin/gcc.exe")
          runner=$(cygpath -m "$(command -v gcc)")
          printf '#include <stdio.h>\n' > "$RUNNER_TEMP/p.c"
          for g in "$runner" "$pinned" "$msvcrt"; do
            echo "== $g"
            "$g" --version | head -n 1
            "$g" -x c -dM -E "$RUNNER_TEMP/p.c" | grep -E 'MSVCRT_VERSION|_UCRT' || true
          done
          cd "$RUNNER_TEMP"
          cmake --version | head -n 1
          cmake "-DPK5D_MODULE=$GITHUB_WORKSPACE/python/cmake/Pk5dToolchain.cmake" "-DPK5D_GCCS=$runner;$pinned;$msvcrt" \
            -P "$GITHUB_WORKSPACE/.github/w03_trial/probe.cmake" || true
          # the toolchain's programs: the DLLs they load (another MinGW-w64 earlier on PATH could serve them)
          bin=$(dirname "$pinned")
          lx="$bin/../libexec/gcc/x86_64-w64-mingw32/12.2.0"
          for f in "$bin"/gcc.exe "$bin"/g++.exe "$bin"/as.exe "$bin"/ld.exe "$bin"/objdump.exe "$lx"/cc1.exe "$lx"/cc1plus.exe \
                   "$lx"/collect2.exe "$lx"/lto-wrapper.exe "$bin"/../x86_64-w64-mingw32/bin/as.exe "$bin"/../x86_64-w64-mingw32/bin/ld.exe; do
            [ -f "$f" ] || { echo "no $f"; continue; }
            echo "== $f: $("$bin/objdump" -p "$f" | grep 'DLL Name' | tr -s ' ' | tr '\n' ' ')"
          done
          ls "$bin"/*.dll "$lx"/*.dll 2>/dev/null || true
          powershell -NoProfile -Command "(Get-Item C:\Windows\System32\ucrtbase.dll).VersionInfo.FileVersion"

  # W03 TRIAL ONLY: the detection fits' speed, three builds of this tree on one runner, alternating
  w03-bench:
    name: W03 trial, the fits' speed (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: MinGW-w64's GCC
        run: |
          bash tools/get_mingw.sh "$RUNNER_TEMP/mingw" | tee "$RUNNER_TEMP/mingw.txt"
          tail -n 1 "$RUNNER_TEMP/mingw.txt" >> "$GITHUB_PATH"
      - name: Three builds (MinGW-w64 with the UCRT's erf, erfc and log; MSVC; MinGW-w64 with libmingwex's)
        run: |
          T=$(cygpath -u "$RUNNER_TEMP")
          build() {
            python -m venv "$T/v_$1"
            "$T/v_$1/Scripts/python" -m pip install -q --upgrade pip
            PETAKIT5D_WINDOWS_TOOLCHAIN=$2 "$T/v_$1/Scripts/python" -m pip install -v . > "$T/pip_$1.log" 2>&1 || { tail -n 80 "$T/pip_$1.log"; return 1; }
            grep 'petakit5d: the Windows toolchain' "$T/pip_$1.log"
            "$T/v_$1/Scripts/python" -c "from petakit5d._ext import load; print(load('core').build_info()['compiler'])"
          }
          build ucrt mingw
          build msvc msvc
          # the base's calls: libmingwex's erf, erfc and log, at 64 bits
          sed -i 's/pk5d_ad::\(erfc\|erf\|log\)(/std::\1(/g' cpp/detection/module.cpp
          grep -n 'std::erf\|std::log' cpp/detection/module.cpp
          ! grep -n 'pk5d_ad::' cpp/detection/module.cpp
          build mingwex mingw
      - name: The fits, alternating
        run: |
          W=$(cygpath -w "$RUNNER_TEMP")
          export W03_W="$W"
          python - <<'EOF'
          import json, os
          w = os.environ["W03_W"]
          py = lambda v: os.path.join(w, "v_" + v, "Scripts", "python.exe")
          script = os.path.join(os.environ["GITHUB_WORKSPACE"], ".github", "w03_trial", "bench_fits.py")
          spec = {
              "name": "w03_fits",
              "repeats": 5,
              "warmup": 1,
              "variants": [
                  {"id": v, "impl": "python", "python": py(v), "script": script,
                   "args": ["--threads", "1", "4", "--repeats", "3"], "timeout": 1800}
                  for v in ("ucrt", "mingwex", "msvc")
              ],
              "compare": [{"a": "ucrt", "b": "msvc"}, {"a": "ucrt", "b": "mingwex"}, {"a": "mingwex", "b": "msvc"}],
          }
          with open(os.path.join(w, "spec.json"), "w", newline="\n") as f:
              json.dump(spec, f, indent=1)
          EOF
          "$(cygpath -u "$RUNNER_TEMP")/v_ucrt/Scripts/python" -m petakit5d.testing.bench run "$W\\spec.json" --out "$W\\bench"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: w03-bench
          path: ${{ runner.temp }}/bench
          if-no-files-found: warn
