name: Python

# The Python port (python/) only; the MATLAB workflow (tests.yml) ignores python/**.
on:
  push:
    branches: [main, dev, test]
    paths: ['python/**', '.github/workflows/python.yml']
  pull_request:
    paths: ['python/**', '.github/workflows/python.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: python

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Linux is the gate. macOS and Windows report without failing the workflow until the port's
    # platform task (E04) and a cpp-zarr wheel whose write_zarr doesn't crash on macOS arm64
    continue-on-error: ${{ matrix.os != 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Linux, Apple silicon, Windows; the oldest tested Python with the pinned
        # environment (Linux), and the newest supported one with the newest packages
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ['3.12', '3.14']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Apple Clang has no OpenMP runtime of its own
      - if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install (pinned environment)
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: -r requirements/linux-x86_64-py312.txt
          python -m pip install -v --no-build-isolation --no-deps .

      - name: Install
        if: ${{ !(runner.os == 'Linux' && matrix.python == '3.12') }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v ".[test]"

      # the OpenMP runtime the build put next to the modules, and the toolset's copies
      - name: OpenMP runtime (Windows)
        if: runner.os == 'Windows'
        run: |
          find "/c/Program Files/Microsoft Visual Studio"/*/*/VC -iname 'libomp140*.dll' 2>/dev/null || true
          ls "$(python -c 'import os, petakit5d; print(os.path.dirname(petakit5d.__file__))')/_ext"

      - name: Build information
        run: |
          python -m pip list
          python -c "from petakit5d._ext import load, groups; print(groups()); print(load('core').build_info())"

      # The runners' CPUs vary from run to run, and the CPU picks NumPy's SIMD loops and
      # OpenBLAS's kernels, which the last bits of some results depend on: name them in the log
      - name: CPU information
        run: |
          if [ -r /proc/cpuinfo ]; then grep -m1 -i 'model name' /proc/cpuinfo || true; fi
          if [ "$RUNNER_OS" = macOS ]; then sysctl -n machdep.cpu.brand_string; fi
          python -c "import numpy; numpy.show_runtime()"
          python - <<'EOF'
          import ctypes, glob, os, numpy
          site = os.path.dirname(os.path.dirname(numpy.__file__))
          libs = glob.glob(os.path.join(site, "numpy*", "*openblas*"))  # numpy.libs
          libs += glob.glob(os.path.join(site, "numpy", ".dylibs", "*openblas*"))  # macOS
          for f in sorted(libs):
              try:
                  get = ctypes.CDLL(f).scipy_openblas_get_corename64_
                  get.restype = ctypes.c_char_p
                  print("NumPy's OpenBLAS kernels:", get().decode(), os.path.basename(f))
              except (OSError, AttributeError) as e:
                  print("NumPy's OpenBLAS:", os.path.basename(f), e)
          EOF

      # what goes into the keys of oracle cases whose keys differed on Windows (input files
      # written there, harness files checked out there), to compare with Linux's
      - name: Oracle key probe (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: >
          python tests/platform/key_probe.py
          tests/stitch/test_imagelist.py::parse_two_cams_auto_primary
          tests/pipeline/test_filenames.py::dataset_two_channels
          tests/tools/test_mip.py::zarr.uint16.slabs
          tests/testing/test_oracle.py::identity_int8_row
          tests/io/test_convert.py::t2z.existing_kept

      - name: Tests
        if: runner.os != 'macOS'
        run: python -m pytest -v --timeout=900

      # macOS: with the cpp-tiff and cpp-zarr 1.7.3 wheels, whichever is imported second crashes
      # on its first write (weak C++ symbols merged across the two modules; fixed in cpp-zarr's
      # next release). Until then the tests run in workers, so that a crash ends only its worker
      # and the rest of the suite still runs.
      - name: Tests (macOS, in workers)
        if: runner.os == 'macOS'
        run: |
          python -m pip install pytest-xdist
          python -m pytest -v --timeout=900 -n 3 --max-worker-restart=2000

  lint:
    name: ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install "ruff==$(sed -n 's/^ruff==\([0-9.]*\).*/\1/p' requirements/linux-x86_64-py312.txt)"
      - run: ruff check .
      - run: ruff format --check .

  # The job framework in Slurm cluster mode (tests/cluster, marker cluster) on a single-node
  # Slurm set up on the runner: bash and Python tasks as real jobs, and the soak test at a size
  # for the runner's 4 CPUs. (MATLAB's workflow has the same job with bash tasks only: its jobs
  # couldn't start MATLAB there.)
  cluster:
    name: Slurm cluster mode (Python 3.12 on ubuntu-24.04)
    runs-on: ubuntu-24.04
    # reports without failing the workflow until it has passed on GitHub's runner twice
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Slurm
        run: sudo bash tests/ci/setup_github_actions_slurm.sh

      - name: Install (pinned environment)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: -r requirements/linux-x86_64-py312.txt
          python -m pip install -v --no-build-isolation --no-deps .

      - name: Cluster tests
        env:
          PETAKIT5D_TEST_SLURM_CONFIG: ${{ github.workspace }}/python/tests/ci/github_actions_slurm.json
          PETAKIT5D_TEST_SLURM_SOAK: 200x20
        run: |
          python -m pytest -v -rA --timeout=1800 -m cluster tests/cluster | tee pytest-cluster.log
          # a skipped test here is a set-up problem (no Slurm, no config)
          if grep -q '^SKIPPED' pytest-cluster.log; then
            echo "::error::Cluster tests were skipped"
            exit 1
          fi

      - name: Show Slurm logs
        if: failure()
        run: |
          squeue || true
          sudo tail -n 100 /var/log/slurm/slurmctld.log /var/log/slurm/slurmd.log
