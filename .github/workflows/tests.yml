      - name: Suite, BlockMIPTest_batchSizeIsRoundedToBlocksAndCapped, MATLAB exits by itself
        id: suite_BlockMIPTest_batchSizeIsRoundedToBlocksAndCapped
        timeout-minutes: 2
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('BlockMIPTest_batchSizeIsRoundedToBlocksAndCapped', {'BlockMIPTest/batchSizeIsRoundedToBlocksAndCapped'});

      - name: After the suite step, BlockMIPTest_batchSizeIsRoundedToBlocksAndCapped
