      - name: Suite, the whole suite, MATLAB exits by itself
        id: suite_all
        timeout-minutes: 22
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('all');

      - name: After the suite step, the whole suite
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh all ${{ steps.suite_all.outcome }}

      - name: Summary
        if: always()
        shell: bash
        run: |
          for f in probe-results/*.txt; do echo "== $f"; cat "$f"; done
          echo "outcomes (success: MATLAB exited by itself; failure with a 'done' line: it hung at exit):"
          echo "  locked ${{ steps.locked.outcome }}, committed ${{ steps.committed.outcome }}, io ${{ steps.io.outcome }}, unload ${{ steps.unload.outcome }}, scale ${{ steps.scale.outcome }}"
          echo "suite parts: see the 'step ended ..., outcome' and 'MATLAB gone ... s after the tests ended' lines of probe-results/suite_*.txt"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mex-exit-probe
          path: probe-results/
          if-no-files-found: ignore
