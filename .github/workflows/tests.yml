      # an exit that crashes (StitchingTest blend mean with the atexit mex and the
      # casting parallelWriteZarr ended in an access violation): MATLAB's own crash
      # reports, which name the module and stack of the faulting thread
      - name: MATLAB crash reports
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for d in "$TEMP" "$TMP" "$LOCALAPPDATA/Temp" "$USERPROFILE/AppData/Local/Temp"; do
            [ -d "$d" ] || continue
            for f in "$d"/matlab_crash_dump*; do
              found=1
              echo "== $f ($(stat -c %y "$f" 2>/dev/null))"
              head -c 20000 "$f"
              echo
            done
          done
          [ "$found" = 1 ] || echo "no MATLAB crash report in the temp folders"

      - name: Summary
        if: always()
        shell: bash
        run: |
          for f in probe-results/*.txt; do echo "== $f"; cat "$f"; done
          echo "per variant: see 'mex in memory from the variant folder', the 'step ended ..., outcome', the 'MATLAB gone ... s' and the '== stacks of MATLAB ...' lines of each probe-results/*.txt"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mex-exit-probe
          path: probe-results/
          if-no-files-found: ignore
