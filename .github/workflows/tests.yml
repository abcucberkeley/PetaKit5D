        run: bash .github/scripts/suite_step_done.sh BlockMIPTest_rangeMaxMatchesMaxOfEachRange_uint16 ${{ steps.suite_BlockMIPTest_rangeMaxMatchesMaxOfEachRange_uint16.outcome }}

