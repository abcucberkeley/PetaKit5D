        run: bash .github/scripts/suite_step_done.sh ComputingMemoryEstimateTest ${{ steps.suite_ComputingMemoryEstimateTest.outcome }}

      - name: Suite, SystemMemoryTest, MATLAB exits by itself
        id: suite_SystemMemoryTest
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('SystemMemoryTest');

      - name: After the suite step, SystemMemoryTest
        if: always()
