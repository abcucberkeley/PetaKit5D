      - name: After the suite step, FeatherBlendingTest
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh FeatherBlendingTest ${{ steps.suite_FeatherBlendingTest.outcome }}

      - name: Suite, StitchHelperMexTest, MATLAB exits by itself
        id: suite_StitchHelperMexTest
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('StitchHelperMexTest');

      - name: After the suite step, StitchHelperMexTest
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh StitchHelperMexTest ${{ steps.suite_StitchHelperMexTest.outcome }}

      - name: Suite, StitchJobResourcesTest, MATLAB exits by itself
        id: suite_StitchJobResourcesTest
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('StitchJobResourcesTest');

      - name: After the suite step, StitchJobResourcesTest
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh StitchJobResourcesTest ${{ steps.suite_StitchJobResourcesTest.outcome }}

      - name: Suite, StitchGeometryTest, MATLAB exits by itself
        id: suite_StitchGeometryTest
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('StitchGeometryTest');

      - name: After the suite step, StitchGeometryTest
