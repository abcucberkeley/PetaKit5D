        shell: bash
        run: bash .github/scripts/suite_step_done.sh StitchGeometryTest ${{ steps.suite_StitchGeometryTest.outcome }}

      - name: Suite, StitchMergeBlockMipsTest, MATLAB exits by itself
        id: suite_StitchMergeBlockMipsTest
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('StitchMergeBlockMipsTest');

      - name: After the suite step, StitchMergeBlockMipsTest
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh StitchMergeBlockMipsTest ${{ steps.suite_StitchMergeBlockMipsTest.outcome }}

      - name: Suite, TiffZarrConversionTest, MATLAB exits by itself
        id: suite_TiffZarrConversionTest
        timeout-minutes: 4
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('TiffZarrConversionTest');

      - name: After the suite step, TiffZarrConversionTest
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh TiffZarrConversionTest ${{ steps.suite_TiffZarrConversionTest.outcome }}

      - name: Suite, ResampleTest, MATLAB exits by itself
        id: suite_ResampleTest
        timeout-minutes: 4
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('ResampleTest');

      - name: After the suite step, ResampleTest
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh ResampleTest ${{ steps.suite_ResampleTest.outcome }}

      - name: Suite, BlockMIPTest, MATLAB exits by itself
        id: suite_BlockMIPTest
        timeout-minutes: 4
        continue-on-error: true
