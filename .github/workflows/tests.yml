name: Tests

on:
  push:
    branches: [main, dev, test]
    # the Python package has its own workflow (python.yml)
    paths-ignore: ['python/**', '.github/workflows/python.yml']
  pull_request:
    paths-ignore: ['python/**', '.github/workflows/python.yml']
  workflow_dispatch:
  schedule:
    # weekly, to catch breakage from runner image or MATLAB updates
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.release }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # the R2026b jobs preview the upcoming migration and may fail without
    # failing the workflow
    continue-on-error: ${{ matrix.release != 'R2024b' }}
    strategy:
      fail-fast: false
      matrix:
        # To migrate, change R2024b to R2026b here and above, and drop the
        # second entry. Labels are pinned: ubuntu-latest moves to 26.04,
        # which neither release supports, and macos-15 is Apple silicon.
        release: [R2024b, R2026b]
        os: [ubuntu-24.04, windows-2025, macos-15]

    steps:
      - uses: actions/checkout@v7

      - uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
          # no cache: these products take ~3.5 GB per OS and release, which
          # exceeds the 10 GB repository cache limit; installing takes ~3 min.
          # Curve Fitting is used by FSC analysis and point detection.
          products: >
            Image_Processing_Toolbox
            Optimization_Toolbox
            Parallel_Computing_Toolbox
            Signal_Processing_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Curve_Fitting_Toolbox

      # short temp paths on Windows (the default has a RUNNER~1 short name)
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TMP=${{ runner.temp }}" >> "$GITHUB_ENV"
          echo "TEMP=${{ runner.temp }}" >> "$GITHUB_ENV"

      # On Windows and macOS, MATLAB hangs or crashes while shutting down
      # after the PetaKit5D mex files have been used, so finishCI stops it
      # right after the tests and the next step checks the results instead
      # of MATLAB's exit code.
      # R2026b runs the suite about 1.8 times slower than R2024b on the macOS
      # runners (about 56 minutes for R2024b's 31), so the limit leaves room
      - name: Run tests
        timeout-minutes: 75
        continue-on-error: ${{ runner.os != 'Linux' }}
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests'); results = run_tests('outputDir', 'test-results'); pktest.finishCI(results, 'test-results');

      - name: Check test results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ ! -f test-results/status.txt ]; then
            echo "::error::MATLAB stopped before the tests finished"
            exit 1
          fi
          cat test-results/status.txt
          failed=$(awk '$1 == "failed" {print $2}' test-results/status.txt)
          if [ "$failed" != "0" ]; then
            echo "::error::$failed test(s) failed"
            exit 1
          fi

      # tests for bugs that are not fixed yet; informational only. A test
      # that passes here means the bug is fixed: remove its KnownIssue tag.
      - name: Check known issues
        if: ${{ !cancelled() && matrix.release == 'R2024b' && runner.os == 'Linux' }}
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests'); run_tests('tag', 'KnownIssue', 'outputDir', 'test-results/known-issues', 'summaryTitle', 'Known issues (expected to fail until fixed)');

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.release }}-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  # the job framework in Slurm cluster mode, on a single-node Slurm cluster
  # set up on the runner (tests/cluster/SlurmClusterTest.m). Jobs run bash
  # tasks only: MATLAB is licensed only inside the matlab-actions steps, so
  # jobs can't start MATLAB here (those tests run on the lab cluster).
  cluster:
    name: Slurm cluster mode (R2024b on ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up Slurm
        run: sudo bash tests/cluster/setup_github_actions_slurm.sh

      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b

      - name: Run cluster tests
        uses: matlab-actions/run-command@v3
        env:
          PETAKIT5D_TEST_SLURM_CONFIG: ${{ github.workspace }}/tests/cluster/github_actions_slurm.json
        with:
          command: addpath('tests'); results = run_tests('tag', 'Cluster', 'outputDir', 'test-results', 'summaryTitle', 'Slurm cluster mode'); pktest.finishCI(results, 'test-results');

      - name: Check test results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ ! -f test-results/status.txt ]; then
            echo "::error::MATLAB stopped before the tests finished"
            exit 1
          fi
          cat test-results/status.txt
          awk '$1 == "passed" && $2 == 0 {exit 1}' test-results/status.txt || { echo "::error::No cluster test ran"; exit 1; }
          failed=$(awk '$1 == "failed" {print $2}' test-results/status.txt)
          if [ "$failed" != "0" ]; then
            echo "::error::$failed test(s) failed"
            exit 1
          fi

      - name: Show Slurm logs
        if: failure()
        run: sudo tail -n 100 /var/log/slurm/slurmctld.log /var/log/slurm/slurmd.log

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-cluster
          path: test-results/
          if-no-files-found: ignore

  # Diagnostic, not required: the exit hang on Windows is a loader-lock deadlock
  # when a MinGW mex file's static-libgomp OpenMP worker ends through
  # FreeLibraryAndExitThread after MATLAB has unloaded the mex file. This tries
  # two fixes on the committed OpenMP mex files, built here into RUNNER_TEMP
  # from changed copies (build_variant_mex; the committed mexw64 are not
  # touched, a variant's folder goes ahead of them on the path): lock, the
  # mexLock that macOS uses, so the mex file is never unloaded; atexit, a
  # mexAtExit handler that ends the OpenMP pool before unload so the workers end
  # while the mex file is still loaded (it stays unloadable, unlike with the
  # lock); and both. parallelWriteZarr and the other cpp-tiff/cpp-zarr mex are
  # vendored and unchanged, so they may still hang.
  # The reproducer under each variant: a PetaKit5D-only mex probe (mex_exit_probe
  # calls the PetaKit5D OpenMP mex files, not the cpp-tiff/cpp-zarr ones) and two
  # known suite hangs (BlockMIPTest's first 16 tests, one StitchingTest blend
  # test), each a MATLAB of its own that must exit by itself before its timeout.
  # probe-results/<part>.txt has the counts, the mex files in memory (and how
  # many came from the variant folder), what could hold MATLAB open, the stacks
  # of the threads if it is alive 30 s after the tests ended (thread_stacks.ps1,
  # which name the mex files whose workers are left), the seconds until MATLAB
  # was gone (watch_matlab_exit.ps1) and the step's outcome.
  exit-probe:
    name: Mex exit probe (R2024b on windows-2025)
    runs-on: windows-2025
    # the step timeouts add up to about 85 minutes
    timeout-minutes: 155
    continue-on-error: true
    # the OpenMP threads of the mex files that take no thread count (their
    # OpenMP runtime reads it when a mex file is loaded; the probe sets it
    # too): 4, also where the runner's MATLAB has maxNumCompThreads 1
    env:
      OMP_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v7

      # the test job's products, for the suite steps
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: >
            Image_Processing_Toolbox
            Optimization_Toolbox
            Parallel_Computing_Toolbox
            Signal_Processing_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Curve_Fitting_Toolbox

      # a debugger for the stacks of a MATLAB that does not exit by itself
      # (thread_stacks.ps1): the Windows SDK's cdb, or else Sysinternals'
      # procdump, whose archive publishes no digest and is replaced in place, so
      # its SHA-256 is pinned here (with a newer archive, the job has no stacks)
      - name: Find a debugger for the stacks
        timeout-minutes: 3
        continue-on-error: true
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path probe-results | Out-Null
          $cdb = @("${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe", "$env:ProgramFiles\Windows Kits\10\Debuggers\x64\cdb.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($cdb) {
            Add-Content -Path $env:GITHUB_ENV -Value "PROBE_CDB=$cdb"
            $note = 'debugger: cdb {0} ({1})' -f (Get-Item $cdb).VersionInfo.FileVersion, $cdb
          } else {
            $zip = Join-Path $env:RUNNER_TEMP 'Procdump.zip'
            Invoke-WebRequest -UseBasicParsing -Uri https://download.sysinternals.com/files/Procdump.zip -OutFile $zip
            $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash
            if ($sha -eq '5fe68e81632f13188930affff20a9a9910170bae654360850d3108cead708a2d') {
              Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'procdump')
              Add-Content -Path $env:GITHUB_ENV -Value ('PROBE_PROCDUMP=' + (Join-Path $env:RUNNER_TEMP 'procdump\procdump64.exe'))
              $note = "debugger: no cdb; procdump (Procdump.zip of SHA-256 $sha)"
            } else {
              $note = "debugger: no cdb, and Procdump.zip has SHA-256 $sha, not the pinned one: no stacks"
            }
          }
          $note
          Set-Content -Path probe-results/debugger.txt -Value $note

      # the MinGW-builds project's release (github.com/niXman/mingw-builds-binaries), the toolchain of the
      # committed mexw64; the release publishes no digest, so the archive's SHA-256 is pinned here
      - name: Get MinGW-w64 12.2.0 (UCRT)
        timeout-minutes: 5
        shell: bash
        run: |
          url=https://github.com/niXman/mingw-builds-binaries/releases/download/12.2.0-rt_v10-rev2/x86_64-12.2.0-release-posix-seh-ucrt-rt_v10-rev2.7z
          curl -sSL --fail -o "$RUNNER_TEMP/mingw.7z" "$url"
          # from stdin: sha256sum puts a backslash before a hash whose file
          # name has backslashes, as Windows paths do
          sha=$(sha256sum < "$RUNNER_TEMP/mingw.7z" | cut -d' ' -f1)
          echo "sha256 $sha"
          if [ "$sha" != "dc1f299e8450c96f59f4b8f7c1290ebb78ee00ddb71f9ed4ca0efaf5462f8c4e" ]; then
            echo "::error::unexpected MinGW archive"
            exit 1
          fi
          7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/mingw.7z" > /dev/null
          echo "MINGW_DIR=$RUNNER_TEMP\\mingw64" >> "$GITHUB_ENV"

      # the PetaKit5D OpenMP mex files built with the lock change, to shadow the committed mex
      - name: Build the lock mex variant
        timeout-minutes: 8
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); build_variant_mex(fullfile(getenv('RUNNER_TEMP'), 'variant_lock'), getenv('MINGW_DIR'), 'lock');

      # the PetaKit5D OpenMP mex files built with the atexit change, to shadow the committed mex
      - name: Build the atexit mex variant
        timeout-minutes: 8
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); build_variant_mex(fullfile(getenv('RUNNER_TEMP'), 'variant_atexit'), getenv('MINGW_DIR'), 'atexit');

      # the PetaKit5D OpenMP mex files built with the both change, to shadow the committed mex
      - name: Build the both mex variant
        timeout-minutes: 8
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); build_variant_mex(fullfile(getenv('RUNNER_TEMP'), 'variant_both'), getenv('MINGW_DIR'), 'both');

      # short temp paths for the suite steps, as in the test job
      - shell: bash
        run: |
          echo "TMP=${{ runner.temp }}" >> "$GITHUB_ENV"
          echo "TEMP=${{ runner.temp }}" >> "$GITHUB_ENV"

      - name: Reproducer, PetaKit5D-only mex probe, committed mex
        id: probe_ourmex_committed
        timeout-minutes: 5
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); mex_exit_probe('ourmex_committed');

      - name: After the reproducer, PetaKit5D-only mex probe, committed mex
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh ourmex_committed ${{ steps.probe_ourmex_committed.outcome }}

      - name: Reproducer, PetaKit5D-only mex probe, lock mex
        id: probe_ourmex_lock
        timeout-minutes: 5
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); mex_exit_probe('ourmex_lock', fullfile(getenv('RUNNER_TEMP'), 'variant_lock'));

      - name: After the reproducer, PetaKit5D-only mex probe, lock mex
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh ourmex_lock ${{ steps.probe_ourmex_lock.outcome }}

      - name: Reproducer, PetaKit5D-only mex probe, atexit mex
        id: probe_ourmex_atexit
        timeout-minutes: 5
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); mex_exit_probe('ourmex_atexit', fullfile(getenv('RUNNER_TEMP'), 'variant_atexit'));

      - name: After the reproducer, PetaKit5D-only mex probe, atexit mex
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh ourmex_atexit ${{ steps.probe_ourmex_atexit.outcome }}

      - name: Reproducer, PetaKit5D-only mex probe, both mex
        id: probe_ourmex_both
        timeout-minutes: 5
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); mex_exit_probe('ourmex_both', fullfile(getenv('RUNNER_TEMP'), 'variant_both'));

      - name: After the reproducer, PetaKit5D-only mex probe, both mex
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh ourmex_both ${{ steps.probe_ourmex_both.outcome }}

      - name: Reproducer, BlockMIPTest first 16, committed mex
        id: suite_BlockMIPTest_first16
        timeout-minutes: 5
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('BlockMIPTest_first16', 'BlockMIPTest/*', 16);

      - name: After the reproducer, BlockMIPTest first 16, committed mex
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh suite_BlockMIPTest_first16 ${{ steps.suite_BlockMIPTest_first16.outcome }}

      - name: Reproducer, BlockMIPTest first 16, lock mex
        id: suite_BlockMIPTest_first16_lock
        timeout-minutes: 5
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('BlockMIPTest_first16_lock', 'BlockMIPTest/*', 16, fullfile(getenv('RUNNER_TEMP'), 'variant_lock'));

      - name: After the reproducer, BlockMIPTest first 16, lock mex
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh suite_BlockMIPTest_first16_lock ${{ steps.suite_BlockMIPTest_first16_lock.outcome }}

      - name: Reproducer, BlockMIPTest first 16, atexit mex
        id: suite_BlockMIPTest_first16_atexit
        timeout-minutes: 5
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('BlockMIPTest_first16_atexit', 'BlockMIPTest/*', 16, fullfile(getenv('RUNNER_TEMP'), 'variant_atexit'));

      - name: After the reproducer, BlockMIPTest first 16, atexit mex
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh suite_BlockMIPTest_first16_atexit ${{ steps.suite_BlockMIPTest_first16_atexit.outcome }}

      - name: Reproducer, BlockMIPTest first 16, both mex
        id: suite_BlockMIPTest_first16_both
        timeout-minutes: 5
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('BlockMIPTest_first16_both', 'BlockMIPTest/*', 16, fullfile(getenv('RUNNER_TEMP'), 'variant_both'));

      - name: After the reproducer, BlockMIPTest first 16, both mex
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh suite_BlockMIPTest_first16_both ${{ steps.suite_BlockMIPTest_first16_both.outcome }}

      - name: Reproducer, StitchingTest blend mean, committed mex
        id: suite_StitchBlendMean
        timeout-minutes: 5
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('StitchBlendMean', {'StitchingTest/blendingWithoutTheMexGivesTheSameResult?tileBlendMethod=mean?'});

      - name: After the reproducer, StitchingTest blend mean, committed mex
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh suite_StitchBlendMean ${{ steps.suite_StitchBlendMean.outcome }}

      - name: Reproducer, StitchingTest blend mean, both mex
        id: suite_StitchBlendMean_both
        timeout-minutes: 5
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('StitchBlendMean_both', {'StitchingTest/blendingWithoutTheMexGivesTheSameResult?tileBlendMethod=mean?'}, [], fullfile(getenv('RUNNER_TEMP'), 'variant_both'));

      - name: After the reproducer, StitchingTest blend mean, both mex
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh suite_StitchBlendMean_both ${{ steps.suite_StitchBlendMean_both.outcome }}

      - name: Reproducer, StitchingTest blend mean, locked mex
        id: suite_StitchBlendMean_lock
        timeout-minutes: 5
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('StitchBlendMean_lock', {'StitchingTest/blendingWithoutTheMexGivesTheSameResult?tileBlendMethod=mean?'}, [], fullfile(getenv('RUNNER_TEMP'), 'variant_lock'));

      - name: After the reproducer, StitchingTest blend mean, locked mex
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh suite_StitchBlendMean_lock ${{ steps.suite_StitchBlendMean_lock.outcome }}

      - name: Reproducer, StitchingTest blend mean, mexAtExit mex
        id: suite_StitchBlendMean_atexit
        timeout-minutes: 5
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('StitchBlendMean_atexit', {'StitchingTest/blendingWithoutTheMexGivesTheSameResult?tileBlendMethod=mean?'}, [], fullfile(getenv('RUNNER_TEMP'), 'variant_atexit'));

      - name: After the reproducer, StitchingTest blend mean, mexAtExit mex
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh suite_StitchBlendMean_atexit ${{ steps.suite_StitchBlendMean_atexit.outcome }}

      # the atexit variant with a parallelWriteZarr that casts the data to the
      # array's class before cpp-zarr's mex (copied as parallelWriteZarr_orig), so
      # that the mex runs no OpenMP of its own: if MATLAB then exits by itself,
      # nothing but cpp-zarr's own OpenMP pool is left in the deadlock
      - name: Make the mex variants with the casting parallelWriteZarr
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          # atexit, lock and both variants with the casting parallelWriteZarr,
          # and cast_only: the committed mex with it
          for v in atexit lock both; do
            d="$RUNNER_TEMP/variant_${v}_cast"
            cp -r "$RUNNER_TEMP/variant_$v" "$d"
            cp .github/scripts/cast_shim_parallelWriteZarr.txt "$d/parallelWriteZarr.m"
          done
          mkdir -p "$RUNNER_TEMP/variant_cast_only"
          cp .github/scripts/cast_shim_parallelWriteZarr.txt "$RUNNER_TEMP/variant_cast_only/parallelWriteZarr.m"
          z=microscopeDataProcessing/io/cpp-zarr/windows
          cp "$z/parallelWriteZarr.mexw64" "$z/parallelWriteZarr_orig.mexw64"
          for v in atexit_cast lock_cast both_cast cast_only; do echo "$v: $(ls "$RUNNER_TEMP/variant_$v" | wc -l) files"; done

      - name: Reproducer, BlockMIPTest first 16, atexit mex and casting parallelWriteZarr
        id: suite_BlockMIPTest_first16_atexit_cast
        timeout-minutes: 5
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        env:
          PROBE_CAST_LOG: ${{ github.workspace }}/probe-results/cast_BlockMIPTest_first16_atexit_cast.txt
        with:
          command: addpath('.github/scripts'); suite_exit_probe('BlockMIPTest_first16_atexit_cast', 'BlockMIPTest/*', 16, fullfile(getenv('RUNNER_TEMP'), 'variant_atexit_cast'));

      - name: After the reproducer, BlockMIPTest first 16, atexit mex and casting parallelWriteZarr
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh suite_BlockMIPTest_first16_atexit_cast ${{ steps.suite_BlockMIPTest_first16_atexit_cast.outcome }}

      - name: Reproducer, StitchingTest blend mean, atexit mex and casting parallelWriteZarr
        id: suite_StitchBlendMean_atexit_cast
        timeout-minutes: 5
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        env:
          PROBE_CAST_LOG: ${{ github.workspace }}/probe-results/cast_StitchBlendMean_atexit_cast.txt
          PROBE_CRASH_CATCH: '1'
        with:
          command: addpath('.github/scripts'); suite_exit_probe('StitchBlendMean_atexit_cast', {'StitchingTest/blendingWithoutTheMexGivesTheSameResult?tileBlendMethod=mean?'}, [], fullfile(getenv('RUNNER_TEMP'), 'variant_atexit_cast'));

      - name: After the reproducer, StitchingTest blend mean, atexit mex and casting parallelWriteZarr
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh suite_StitchBlendMean_atexit_cast ${{ steps.suite_StitchBlendMean_atexit_cast.outcome }}

      - name: Reproducer, BlockMIPTest first 16, committed mex and casting parallelWriteZarr
        id: suite_BlockMIPTest_first16_cast_only
        timeout-minutes: 5
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        env:
          PROBE_CAST_LOG: ${{ github.workspace }}/probe-results/cast_BlockMIPTest_first16_cast_only.txt
        with:
          command: addpath('.github/scripts'); suite_exit_probe('BlockMIPTest_first16_cast_only', 'BlockMIPTest/*', 16, fullfile(getenv('RUNNER_TEMP'), 'variant_cast_only'));

      - name: After the reproducer, BlockMIPTest first 16, committed mex and casting parallelWriteZarr
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh suite_BlockMIPTest_first16_cast_only ${{ steps.suite_BlockMIPTest_first16_cast_only.outcome }}

      - name: Reproducer, StitchingTest blend mean, locked mex and casting parallelWriteZarr
        id: suite_StitchBlendMean_lock_cast
        timeout-minutes: 5
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        env:
          PROBE_CAST_LOG: ${{ github.workspace }}/probe-results/cast_StitchBlendMean_lock_cast.txt
          PROBE_CRASH_CATCH: '1'
        with:
          command: addpath('.github/scripts'); suite_exit_probe('StitchBlendMean_lock_cast', {'StitchingTest/blendingWithoutTheMexGivesTheSameResult?tileBlendMethod=mean?'}, [], fullfile(getenv('RUNNER_TEMP'), 'variant_lock_cast'));

      - name: After the reproducer, StitchingTest blend mean, locked mex and casting parallelWriteZarr
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh suite_StitchBlendMean_lock_cast ${{ steps.suite_StitchBlendMean_lock_cast.outcome }}

      - name: Reproducer, StitchingTest blend mean, both mex and casting parallelWriteZarr
