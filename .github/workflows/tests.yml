        shell: bash
        run: bash .github/scripts/suite_step_done.sh ImageListGenerationTest ${{ steps.suite_ImageListGenerationTest.outcome }}

      - name: Suite, TileBlendingTest, MATLAB exits by itself
        id: suite_TileBlendingTest
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('TileBlendingTest');

      - name: After the suite step, TileBlendingTest
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh TileBlendingTest ${{ steps.suite_TileBlendingTest.outcome }}

      - name: Suite, PhaseFlatFieldCorrectionTest, MATLAB exits by itself
        id: suite_PhaseFlatFieldCorrectionTest
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('PhaseFlatFieldCorrectionTest');

      - name: After the suite step, PhaseFlatFieldCorrectionTest
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh PhaseFlatFieldCorrectionTest ${{ steps.suite_PhaseFlatFieldCorrectionTest.outcome }}

      - name: Suite, FeatherBlendingTest, MATLAB exits by itself
        id: suite_FeatherBlendingTest
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
