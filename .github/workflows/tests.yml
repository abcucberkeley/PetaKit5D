name: Tests

on:
  push:
    branches: [main, dev, test]
    # the Python package has its own workflow (python.yml)
    paths-ignore: ['python/**', '.github/workflows/python.yml']
  pull_request:
    paths-ignore: ['python/**', '.github/workflows/python.yml']
  workflow_dispatch:
  schedule:
    # weekly, to catch breakage from runner image or MATLAB updates
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.release }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # the R2026b jobs preview the upcoming migration and may fail without
    # failing the workflow
    continue-on-error: ${{ matrix.release != 'R2024b' }}
    strategy:
      fail-fast: false
      matrix:
        # To migrate, change R2024b to R2026b here and above, and drop the
        # second entry. Labels are pinned: ubuntu-latest moves to 26.04,
        # which neither release supports, and macos-15 is Apple silicon.
        release: [R2024b, R2026b]
        os: [ubuntu-24.04, windows-2025, macos-15]

    steps:
      - uses: actions/checkout@v7

      - uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
          # no cache: these products take ~3.5 GB per OS and release, which
          # exceeds the 10 GB repository cache limit; installing takes ~3 min.
          # Curve Fitting is used by FSC analysis and point detection.
          products: >
            Image_Processing_Toolbox
            Optimization_Toolbox
            Parallel_Computing_Toolbox
            Signal_Processing_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Curve_Fitting_Toolbox

      # short temp paths on Windows (the default has a RUNNER~1 short name)
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TMP=${{ runner.temp }}" >> "$GITHUB_ENV"
          echo "TEMP=${{ runner.temp }}" >> "$GITHUB_ENV"

      # On Windows and macOS, MATLAB hangs or crashes while shutting down
      # after the PetaKit5D mex files have been used, so finishCI stops it
      # right after the tests and the next step checks the results instead
      # of MATLAB's exit code.
      # R2026b runs the suite about 1.8 times slower than R2024b on the macOS
      # runners (about 56 minutes for R2024b's 31), so the limit leaves room
      - name: Run tests
        timeout-minutes: 75
        continue-on-error: ${{ runner.os != 'Linux' }}
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests'); results = run_tests('outputDir', 'test-results'); pktest.finishCI(results, 'test-results');

      - name: Check test results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ ! -f test-results/status.txt ]; then
            echo "::error::MATLAB stopped before the tests finished"
            exit 1
          fi
          cat test-results/status.txt
          failed=$(awk '$1 == "failed" {print $2}' test-results/status.txt)
          if [ "$failed" != "0" ]; then
            echo "::error::$failed test(s) failed"
            exit 1
          fi

      # tests for bugs that are not fixed yet; informational only. A test
      # that passes here means the bug is fixed: remove its KnownIssue tag.
      - name: Check known issues
        if: ${{ !cancelled() && matrix.release == 'R2024b' && runner.os == 'Linux' }}
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests'); run_tests('tag', 'KnownIssue', 'outputDir', 'test-results/known-issues', 'summaryTitle', 'Known issues (expected to fail until fixed)');

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.release }}-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  # the job framework in Slurm cluster mode, on a single-node Slurm cluster
  # set up on the runner (tests/cluster/SlurmClusterTest.m). Jobs run bash
  # tasks only: MATLAB is licensed only inside the matlab-actions steps, so
  # jobs can't start MATLAB here (those tests run on the lab cluster).
  cluster:
    name: Slurm cluster mode (R2024b on ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up Slurm
        run: sudo bash tests/cluster/setup_github_actions_slurm.sh

      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b

      - name: Run cluster tests
        uses: matlab-actions/run-command@v3
        env:
          PETAKIT5D_TEST_SLURM_CONFIG: ${{ github.workspace }}/tests/cluster/github_actions_slurm.json
        with:
          command: addpath('tests'); results = run_tests('tag', 'Cluster', 'outputDir', 'test-results', 'summaryTitle', 'Slurm cluster mode'); pktest.finishCI(results, 'test-results');

      - name: Check test results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ ! -f test-results/status.txt ]; then
            echo "::error::MATLAB stopped before the tests finished"
            exit 1
          fi
          cat test-results/status.txt
          awk '$1 == "passed" && $2 == 0 {exit 1}' test-results/status.txt || { echo "::error::No cluster test ran"; exit 1; }
          failed=$(awk '$1 == "failed" {print $2}' test-results/status.txt)
          if [ "$failed" != "0" ]; then
            echo "::error::$failed test(s) failed"
            exit 1
          fi

      - name: Show Slurm logs
        if: failure()
        run: sudo tail -n 100 /var/log/slurm/slurmctld.log /var/log/slurm/slurmd.log

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-cluster
          path: test-results/
          if-no-files-found: ignore

  # Diagnostic, not required: does MATLAB on Windows exit by itself after the
  # PetaKit5D OpenMP mex files ran? (The test job stops MATLAB with finishCI
  # because it hangs at exit there.) Each probe is a MATLAB session of its own
  # that writes probe-results/<probe>.txt and returns; one that doesn't exit
  # by itself runs into its step timeout (outcome failure, results written).
  # The mex files that lock themselves on Windows too are built here, in the
  # runner's temp folder, with the MinGW-w64 of the committed mexw64 (12.2.0
  # posix-seh UCRT rt_v10-rev2): setup.m adds every folder of the repository
  # to the path, so binaries in it would shadow the repository's.
  # Then the test suite in parts, as the test job runs it but without finishCI:
  # each tests/ folder, and then all of them, in a MATLAB of its own that must
  # exit by itself before its step's timeout. probe-results/suite_<part>.txt
  # has the counts, the mex files in memory, the seconds from the end of the
  # tests until MATLAB was gone (watch_matlab_exit.ps1, with its threads and CPU
  # time while it is alive) and the step's outcome.
  exit-probe:
    name: Mex exit probe (R2024b on windows-2025)
    runs-on: windows-2025
    # the step timeouts add up to about 145 minutes
    timeout-minutes: 155
    continue-on-error: true
    # the OpenMP threads of the mex files that take no thread count (their
    # OpenMP runtime reads it when a mex file is loaded; the probe sets it
    # too): 4, also where the runner's MATLAB has maxNumCompThreads 1
    env:
      OMP_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v7

      # the test job's products, for the suite steps
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: >
            Image_Processing_Toolbox
            Optimization_Toolbox
            Parallel_Computing_Toolbox
            Signal_Processing_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Curve_Fitting_Toolbox

      # the MinGW-builds project's release (github.com/niXman/mingw-builds-binaries), the toolchain of the
      # committed mexw64; the release publishes no digest, so the archive's SHA-256 is pinned here
      - name: Get MinGW-w64 12.2.0 (UCRT)
        shell: bash
        run: |
          url=https://github.com/niXman/mingw-builds-binaries/releases/download/12.2.0-rt_v10-rev2/x86_64-12.2.0-release-posix-seh-ucrt-rt_v10-rev2.7z
          curl -sSL --fail -o "$RUNNER_TEMP/mingw.7z" "$url"
          # from stdin: sha256sum puts a backslash before a hash whose file
          # name has backslashes, as Windows paths do
          sha=$(sha256sum < "$RUNNER_TEMP/mingw.7z" | cut -d' ' -f1)
          echo "sha256 $sha"
          if [ "$sha" != "dc1f299e8450c96f59f4b8f7c1290ebb78ee00ddb71f9ed4ca0efaf5462f8c4e" ]; then
            echo "::error::unexpected MinGW archive"
            exit 1
          fi
          7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/mingw.7z" > /dev/null
          echo "MINGW_DIR=$RUNNER_TEMP\\mingw64" >> "$GITHUB_ENV"

      - name: Build mex files that lock themselves on Windows too
        timeout-minutes: 15
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); build_lockwin_mex(fullfile(getenv('RUNNER_TEMP'), 'lockwin'), getenv('MINGW_DIR'));

      # the mex files that lock themselves first, on a fresh runner
      - name: Probe, mex files that lock themselves
        id: locked
        timeout-minutes: 8
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); mex_exit_probe('locked', fullfile(getenv('RUNNER_TEMP'), 'lockwin'));

      - name: Probe, the committed mex files
        id: committed
        timeout-minutes: 8
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); mex_exit_probe('committed');

      - name: Probe, cpp-tiff and cpp-zarr only
        id: io
        timeout-minutes: 8
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); mex_exit_probe('io');

      # clear mex unloads the mex files during the session: if it hangs, the
      # unload of OpenMP mex files with their threads is what hangs at exit
      - name: Probe, the committed mex files, then clear mex
        id: unload
        timeout-minutes: 8
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); mex_exit_probe('unload');

      # closer to win10vm (8 cores): 8 threads per mex file, maxNumCompThreads 8,
      # the calls in 5 rounds
      - name: Probe, the committed mex files at scale
        id: scale
        timeout-minutes: 8
        continue-on-error: true
        env:
          OMP_NUM_THREADS: 8
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); mex_exit_probe('scale');

      # short temp paths for the suite steps, as in the test job
      - shell: bash
        run: |
          echo "TMP=${{ runner.temp }}" >> "$GITHUB_ENV"
          echo "TEMP=${{ runner.temp }}" >> "$GITHUB_ENV"

      - name: Suite, tests/decon, MATLAB exits by itself
        id: suite_decon
        timeout-minutes: 6
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('decon');

      - name: After the suite step, tests/decon
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh decon ${{ steps.suite_decon.outcome }}

      - name: Suite, tests/stitch, MATLAB exits by itself
        id: suite_stitch
        timeout-minutes: 6
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('stitch');

      - name: After the suite step, tests/stitch
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh stitch ${{ steps.suite_stitch.outcome }}

      - name: Suite, tests/deskew_rotate, MATLAB exits by itself
        id: suite_deskew_rotate
        timeout-minutes: 4
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('deskew_rotate');

      - name: After the suite step, tests/deskew_rotate
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh deskew_rotate ${{ steps.suite_deskew_rotate.outcome }}

      - name: Suite, tests/framework, MATLAB exits by itself
        id: suite_framework
        timeout-minutes: 11
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('framework');

      - name: After the suite step, tests/framework
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh framework ${{ steps.suite_framework.outcome }}

      - name: Suite, tests/tools, MATLAB exits by itself
        id: suite_tools
        timeout-minutes: 6
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('tools');

      - name: After the suite step, tests/tools
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh tools ${{ steps.suite_tools.outcome }}

      - name: Suite, tests/io, MATLAB exits by itself
        id: suite_io
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('io');

      - name: After the suite step, tests/io
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh io ${{ steps.suite_io.outcome }}

      - name: Suite, tests/crop, MATLAB exits by itself
        id: suite_crop
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('crop');

      - name: After the suite step, tests/crop
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh crop ${{ steps.suite_crop.outcome }}

      - name: Suite, tests/flatfield, MATLAB exits by itself
        id: suite_flatfield
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('flatfield');

      - name: After the suite step, tests/flatfield
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh flatfield ${{ steps.suite_flatfield.outcome }}

      - name: Suite, tests/analysis, MATLAB exits by itself
        id: suite_analysis
        timeout-minutes: 4
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('analysis');

      - name: After the suite step, tests/analysis
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh analysis ${{ steps.suite_analysis.outcome }}

      - name: Suite, tests/golden, MATLAB exits by itself
        id: suite_golden
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('golden');

      - name: After the suite step, tests/golden
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh golden ${{ steps.suite_golden.outcome }}

      - name: Suite, tests/pipeline, MATLAB exits by itself
        id: suite_pipeline
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('pipeline');

      - name: After the suite step, tests/pipeline
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh pipeline ${{ steps.suite_pipeline.outcome }}

      - name: Suite, tests/point_detection, MATLAB exits by itself
        id: suite_point_detection
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('point_detection');

      - name: After the suite step, tests/point_detection
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh point_detection ${{ steps.suite_point_detection.outcome }}

      - name: Suite, tests/platform, MATLAB exits by itself
        id: suite_platform
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('platform');

      - name: After the suite step, tests/platform
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh platform ${{ steps.suite_platform.outcome }}

      - name: Suite, tests/isolation, MATLAB exits by itself
        id: suite_isolation
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('isolation');

      - name: After the suite step, tests/isolation
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh isolation ${{ steps.suite_isolation.outcome }}

      - name: Suite, tests/cluster, MATLAB exits by itself
        id: suite_cluster
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('cluster');

      - name: After the suite step, tests/cluster
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh cluster ${{ steps.suite_cluster.outcome }}

      - name: Suite, tests/demo_data, MATLAB exits by itself
        id: suite_demo_data
        timeout-minutes: 3
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('demo_data');

      - name: After the suite step, tests/demo_data
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh demo_data ${{ steps.suite_demo_data.outcome }}

      - name: Suite, the whole suite, MATLAB exits by itself
        id: suite_all
        timeout-minutes: 22
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('.github/scripts'); suite_exit_probe('all');

      - name: After the suite step, the whole suite
        if: always()
        shell: bash
        run: bash .github/scripts/suite_step_done.sh all ${{ steps.suite_all.outcome }}

      - name: Summary
        if: always()
        shell: bash
        run: |
          for f in probe-results/*.txt; do echo "== $f"; cat "$f"; done
          echo "outcomes (success: MATLAB exited by itself; failure with a 'done' line: it hung at exit):"
          echo "  locked ${{ steps.locked.outcome }}, committed ${{ steps.committed.outcome }}, io ${{ steps.io.outcome }}, unload ${{ steps.unload.outcome }}, scale ${{ steps.scale.outcome }}"
          echo "suite parts: see the 'step ended ..., outcome' and 'MATLAB gone ... s after the tests ended' lines of probe-results/suite_*.txt"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mex-exit-probe
          path: probe-results/
          if-no-files-found: ignore
