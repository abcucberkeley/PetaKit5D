        run: bash .github/scripts/suite_step_done.sh RegistrationXcorrTest ${{ steps.suite_RegistrationXcorrTest.outcome }}

      - name: Suite, ImageListGenerationTest, MATLAB exits by itself
        id: suite_ImageListGenerationTest
