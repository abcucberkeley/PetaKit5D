name: Wheels

# The release wheels of the Python port (python/; python/docs/release.md), as artifacts of the
# run: nothing is published or uploaded anywhere else, and no secret is used.
#   - petakit5d for Linux x86-64 (manylinux_2_28, in the image pyproject.toml pins), macOS arm64
#     and Windows x86-64, for CPython 3.11 and 3.12 (abi3: 3.12 and newer), with cibuildwheel from
#     [tool.cibuildwheel] in python/pyproject.toml: each wheel repaired, audited (abi3audit) and
#     tested by its test command, then checked by python/tools/check_wheel.py;
#   - the source distribution (no cpp/fft/exact/), and a wheel built from it alone and tested;
#   - the exact FFT add-on (python/cpp/fft/exact, GPL): one py3 wheel per platform, tested and
#     checked the same way.
# Runs for release tags, trial branches and by hand; the test branch's pushes don't run it.
on:
  push:
    tags: ['v*']
    branches: [wheels-trial]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: python

env:
  CIBUILDWHEEL: cibuildwheel==4.3.5

jobs:
  wheels:
    name: petakit5d on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # cibuildwheel's own Python, and the checks'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: python -m pip install "$CIBUILDWHEEL"

      # from python/, so that only the package is copied into the Linux container
      - name: Build, repair, audit and test
        run: python -m cibuildwheel --output-dir wheelhouse .

      - name: Release checks
        run: python tools/check_wheel.py wheelhouse

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: petakit5d-${{ runner.os }}-${{ runner.arch }}
          path: python/wheelhouse/*.whl
          if-no-files-found: warn

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build the sdist
        run: |
          python -m pip install build==1.6.1
          python -m build --sdist --outdir dist .

      # in an isolated build from the sdist alone, then tested by its own test files
      - name: Build a wheel from it
        run: python -m pip wheel -v --no-deps --wheel-dir dist/from-sdist dist/*.tar.gz

      - name: Release checks
        run: python tools/check_wheel.py dist dist/from-sdist

      - name: Test the wheel
        run: |
          mkdir -p "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/from-sdist/*.whl "pytest>=8" "pytest-timeout>=2.3"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q -p no:cacheprovider sdist/*/tests/test_smoke.py sdist/*/tests/test_openmp_runtime.py

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: sdist
          path: python/dist/*.tar.gz
          if-no-files-found: warn

  addon:
    name: petakit5d-fftw on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        working-directory: python/cpp/fft/exact
    env:
      # one py3-none wheel per platform serves every Python: built and tested once
      CIBW_BUILD: cp312-*
      CIBW_SKIP: '*-musllinux_*'
      CIBW_ARCHS_LINUX: x86_64
      CIBW_ARCHS_MACOS: arm64
      CIBW_ARCHS_WINDOWS: AMD64
      # the image of petakit5d's wheels (python/pyproject.toml), so that both are built alike
      CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64:2026.06.04-1
      # the two libraries need nothing outside the system (delvewheel checks that) and no record
      # of the build machine's folders
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair --analyze-existing --no-diagnostic -w {dest_dir} {wheel}
      # both libraries load and are FFTW 3.3.8
      CIBW_TEST_COMMAND: >-
        python -c "import ctypes, petakit5d_fftw as m;
        v = [(ctypes.c_char * 64).in_dll(ctypes.CDLL(p), n).value for p, n in
        zip(m.library_paths(), ('fftwf_version', 'fftw_version'))];
        print(v); assert all(x.startswith(b'fftw-3.3.8') for x in v), v"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: python -m pip install "$CIBUILDWHEEL"

      - name: Build, repair and test
        run: python -m cibuildwheel --output-dir wheelhouse .

      - name: Release checks
        run: python ../../../tools/check_wheel.py wheelhouse

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: petakit5d-fftw-${{ runner.os }}-${{ runner.arch }}
          path: python/cpp/fft/exact/wheelhouse/*.whl
          if-no-files-found: warn
